# CI for dsh-power-button. The committed `lib/` artifacts are what git installs
# run, so the pipeline enforces that they are byte-fresh: build must produce zero
# diff against what is checked in. The runtime acceptance suite spawns real
# processes on every OS — exactly the layer (detached processes, pid liveness,
# port release) that unit tests and a single platform cannot prove, which is why
# the matrix covers all three supported platforms.
#
# The matrix runs one Node version; `package.json` declares `>=22.19`, so a
# second job covers that declared floor. Widening the matrix to 3 OS x 2 Node
# would cost six jobs to re-prove what one extra job shows.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners default to autocrlf, which would rewrite the checked-in
      # LF artifacts and make the lib-diff gate fail spuriously.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The root tsconfig excludes tests/ and vitest only transpiles them, so a
      # required field can change under the runtime suite and surface as a
      # failing assertion instead of a compile error.
      - run: pnpm typecheck:tests
      - run: pnpm test
      - run: pnpm build
      - name: committed lib/ matches the build
        run: git diff --exit-code -- lib
      # A git install ships exactly the `files` set, so a missing `lib/` entry
      # produces a plugin that installs cleanly and then fails to load. `pnpm
      # pack` is the packer this project pins; `npm pack --dry-run` is not a
      # substitute for asserting on what that packer actually emits.
      - name: the published file set is complete
        shell: bash
        run: |
          set -euo pipefail
          pnpm pack > /dev/null
          tarball=$(ls dsh-power-button-*.tgz)
          entries=$(tar -tzf "$tarball")
          rm -f "$tarball"
          for entry in lib/index.js lib/index.d.ts lib/client.js cordis.patch.yml package.json; do
            if ! grep -qx "package/$entry" <<< "$entries"; then
              echo "missing from the tarball: $entry"
              exit 1
            fi
          done

  # `engines.node` promises >=22.19 and nothing else here runs Node 22, so the
  # promise was unverified. One job on the declared floor is enough: the OS
  # matrix above already covers platform behaviour.
  compat-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:tests
      - run: pnpm test
      - run: pnpm build
      # The build output is not Node-version dependent, so this also proves the
      # shipped artifacts are reproducible at the declared floor.
      - name: committed lib/ matches a floor-version build
        run: git diff --exit-code -- lib
